<!DOCTYPE html>
<html>
<head>
  <title>Google Meet Room</title>
</head>
<body>
  <div id="meeting-grid">
    <div class="participant">User A</div>
    <div class="participant">User B</div>
  </div>
  <div id="controls-bar">
    <button aria-label="Turn off microphone (ctrl + d)" data-is-muted="false">Mute Mic</button>
    <button aria-label="Turn off camera (ctrl + e)">Camera</button>
    <button aria-label="Leave call" class="end-call-btn" data-tooltip="Leave call">Leave</button>
  </div>
</body>
</html>
