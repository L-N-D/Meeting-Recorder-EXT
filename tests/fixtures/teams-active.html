<!DOCTYPE html>
<html>
<head>
  <title>MS Teams Call</title>
</head>
<body>
  <div id="teams-meeting-layout">
    <div class="video-grid">Participants</div>
    <div class="control-strip">
      <button id="microphone-button" aria-label="Mute microphone (ctrl + shift + m)">Mute</button>
      <button data-tid="hangup-button" aria-label="Leave call" id="hangup-button">Hang Up</button>
    </div>
  </div>
</body>
</html>
